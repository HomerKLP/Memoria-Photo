name: tests

# A PR from dev shows this run's result too, so PRs need no run of their own.
on:
  push:
    branches: [dev]
  workflow_dispatch:

# A newer push stops the older run.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ORG_GRADLE_PROJECT_coverage: "true"
      IMAGE: "system-images;android-37.0;google_apis;x86_64"
      # avdmanager and the emulator look in different folders on GitHub's runner unless this is set
      ANDROID_AVD_HOME: /home/runner/.android/avd
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5

      # make check, plus the unit coverage report
      - name: Unit and screenshot tests
        run: ./gradlew --continue :app:createDebugUnitTestCoverageReport :app:validateDebugScreenshotTest

      # The emulator needs KVM; the Pixel 6 screen is 1080 px wide, 360 dp at density 480 like the mockup.
      # Booted here, not by make layout, so a failed boot stops in 10 minutes and prints the emulator's log.
      - name: Emulator
        id: emulator
        if: ${{ !cancelled() }}
        run: |
          mkdir -p $ANDROID_AVD_HOME
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager emulator platform-tools "$IMAGE" > /dev/null
          echo no | $ANDROID_HOME/cmdline-tools/latest/bin/avdmanager create avd -n ci -k "$IMAGE" -d pixel_6
          $ANDROID_HOME/emulator/emulator -accel-check
          $ANDROID_HOME/emulator/emulator -avd ci -no-window -no-snapshot-save -no-audio -no-boot-anim -gpu swiftshader_indirect -memory 4096 -cores 4 > emulator.log 2>&1 &
          pid=$!
          booted() { [ "$($ANDROID_HOME/platform-tools/adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; }
          for i in $(seq 120); do booted || ! kill -0 $pid 2>/dev/null && break; sleep 5; done
          booted || { echo "Emulator did not boot:"; tail -100 emulator.log; exit 1; }
          echo "Booted in about $((i * 5)) s"

      - name: Device tests
        if: ${{ !cancelled() && steps.emulator.outcome == 'success' }}
        run: >
          make layout AVD=ci
          ADB=$ANDROID_HOME/platform-tools/adb
          EMULATOR=$ANDROID_HOME/emulator/emulator
          TASK=:app:createDebugAndroidTestCoverageReport

      - name: Coverage
        if: ${{ !cancelled() }}
        run: python3 .github/coverage.py $(find app/build/reports/coverage -name report.xml) >> $GITHUB_STEP_SUMMARY

      # always(): a cancelled or timed-out run still leaves its screenshots and logs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/screenshotTest-results/
            emulator.log
          retention-days: 14
